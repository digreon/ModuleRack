name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxrandr-dev \
                                  libxinerama-dev libxcursor-dev libfreetype6-dev \
                                  libfontconfig1-dev ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # AUv3 is skipped here: it builds an app-extension bundle that hasn't been
      # validated on a bare CI runner. Build it on a Mac with the default options.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMODULERACK_BUILD_AUV3=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
